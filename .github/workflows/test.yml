name: pile-c-test
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ecmwf-opendata xarray cfgrib eccodes
      - run: python pile_c_test.py
